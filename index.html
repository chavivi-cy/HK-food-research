<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>港九茶餐厅 · 研发考察工作台 V2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 40vh; width: 100%; z-index: 10; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #info-panel { height: 60vh; overflow-y: auto; background-color: #f1f5f9; padding-bottom: 3rem; }
        /* 过渡动画 */
        .card-transition { transition: all 0.3s ease; }
        .done-card { opacity: 0.7; filter: grayscale(20%); border-left: 4px solid #10b981 !important; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden flex flex-col h-screen">

    <header class="bg-slate-900 text-white p-4 shadow-md z-20 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wider">港九 R&D 考察行动</h1>
            <p class="text-xs text-slate-400 mt-1">实地勘测与菜品复刻工作台</p>
        </div>
        <div class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">V 2.0</div>
    </header>

    <div class="bg-white border-b border-slate-200 z-20 shadow-sm">
        <ul id="day-tabs" class="flex overflow-x-auto hide-scrollbar text-sm font-medium text-center">
            </ul>
    </div>

    <div id="map" class="shadow-inner border-b border-slate-300"></div>

    <div id="info-panel" class="px-4 py-2 relative z-20">
        <h2 id="day-title" class="text-lg font-bold text-slate-800 my-3 sticky top-0 bg-slate-100/95 backdrop-blur py-2 z-10 rounded"></h2>
        <div id="locations-container" class="space-y-4">
            </div>
    </div>

<script>
    // --- 本地存储数据初始化 (自动保存在手机浏览器) ---
    const STORAGE_KEY = 'hk_rd_map_data';
    let userNotes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

    function saveLocalData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userNotes));
    }

    // --- 核心数据字典 (新增备选高星餐厅) ---
    const itineraryData = [
        {
            day: 1, label: "Day 1", title: "新界西：烧鹅双绝与冰室微创新",
            locations: [
                { name: "华嫂冰室 (屏山总店)", lat: 22.4455, lng: 114.0084, tags: ["微创新", "高客单价"], focus: "拆解招牌番茄煎蛋菠萝包，考察通过酸甜口解腻来提升传统点心溢价的思路。", transit: "🚇 屯马线【天水围站】转轻铁至【坑尾村站】。" },
                { name: "天鸿烧鹅 (元朗)", lat: 22.4442, lng: 114.0287, tags: ["元朗派", "佛山黑鬃鹅"], focus: "【课题A：元朗派】考察肉质厚度、五香盐/酱柱侯腌料香气，及酸梅酱解腻比例。", transit: "🚇 屯马线【朗屏站】E出口，步行10分钟。" },
                { name: "裕记大饭店 (深井)", lat: 22.3664, lng: 114.0611, tags: ["深井派", "炭火明炉"], focus: "【课题B：深井派】明炉炭烧技法。评测皮脆度、鹅油保留度及炭香附着表现。", transit: "🚌 荃湾站转乘 96M 绿色小巴至【深井村】。" }
            ]
        },
        {
            day: 2, label: "Day 2", title: "九龙西：水吧灵魂与街头镬气",
            locations: [
                { name: "金华冰厅 (太子)", lat: 22.3223, lng: 114.1693, tags: ["水吧基本功", "全港第一包"], focus: "测试酥皮猪黄油比例、起酥工艺，观摩水吧师傅拉茶手法与红茶拼配。", transit: "🚇 【太子站】B2出口，步行3分钟。" },
                { name: "新香园 (坚记)", lat: 22.3292, lng: 114.1616, tags: ["免治牛肉", "高翻台率"], focus: "驰名蛋牛治。研究免治碎牛去筋与腌制手法，测试其与蛋液完美融合的高利润打法。", transit: "🚇 【深水埗站】C2出口，步行3分钟。" },
                { name: "爱文生大排档", lat: 22.3278, lng: 114.1631, tags: ["极致镬气", "晚市爆款"], focus: "试吃黑椒薯仔牛柳粒。观摩猛火爆炒收汁节奏，反哺门店干炒牛河与铁板菜。", transit: "🚇 【深水埗站】A2出口，步行8分钟。" }
            ]
        },
        {
            day: 3, label: "Day 3", title: "港岛西至大坑：肉类处理与滑蛋",
            locations: [
                { name: "科记咖啡餐厅", lat: 22.2858, lng: 114.1485, tags: ["猪扒天花板", "物理松肉"], focus: "金牌猪扒。考察带骨猪扒物理松肉手法、特制豉油腌料，研究肉质不柴的秘诀。", transit: "🚇 【上环站】A2出口，沿荷李活道上坡。" },
                { name: "波记烧腊粉面店", lat: 22.2863, lng: 114.1365, tags: ["米其林", "纯正濑粉"], focus: "考察烧鸭烧肉斩件标准与汁水保留，体验搭配烧腊的纯正“濑粉”清汤底。", transit: "🚇 【香港大学站】B1出口，步行3分钟。" },
                { name: "顺兴车仔面茶餐厅", lat: 22.2789, lng: 114.1920, tags: ["滑蛋火候", "核心手艺"], focus: "滑蛋三宝饭。考察茶餐厅核心基本功：蛋液中淡奶油/水淀粉配比，及推蛋火候。", transit: "🚇 【天后站】A2出口，步行约10分钟。" }
            ]
        },
        {
            day: 4, label: "Day 4", title: "九龙东：灵魂酱汁与工厦创意",
            locations: [
                { name: "联发茶餐厅", lat: 22.3294, lng: 114.1895, tags: ["茶走", "厚多士"], focus: "评测厚多士烘烤火候与黄油涂抹方式，测试丝袜奶茶挂杯度与茶奶比例。", transit: "🚇 【宋皇台站】B3出口，步行3分钟。" },
                { name: "海潮食堂", lat: 22.3105, lng: 114.2235, tags: ["工厦神店", "创意混搭"], focus: "魔鬼多士、葱花蛋治。学习如何用极低成本食材做混搭爆款，迎合年轻客群。", transit: "🚇 【观塘站】B1出口，成业工业大厦地下。" },
                { name: "方荣记沙嗲牛肉", lat: 22.3308, lng: 114.1882, tags: ["秘制沙爹酱", "独一档"], focus: "拆解浓郁沙爹酱。评测花生酱、沙茶、香料比例，旨在衍生沙爹粉丝肥牛煲爆品。", transit: "🚇 【宋皇台站】B3出口，步行5分钟。" }
            ]
        },
        {
            day: 5, label: "Day 5", title: "港岛东至九龙：汤底精髓与豉油西餐",
            locations: [
                { name: "炳记茶档", lat: 22.2785, lng: 114.1925, tags: ["铁皮档", "出前一丁"], focus: "考察独特黑椒香气的煎猪扒，及煮“出前一丁”的过冷河爽口技术。", transit: "🚇 【天后站】A2出口，步行约8分钟。" },
                { name: "华姐清汤腩", lat: 22.2825, lng: 114.1917, tags: ["清汤牛腩", "香料配比"], focus: "考察香料包配比、牛骨汤底清澈度与鲜甜度，改进门店咖喱/柱侯底汤。", transit: "🚇 【天后站】A2出口，电气道。" },
                { name: "哥登堡餐厅", lat: 22.3162, lng: 114.1878, tags: ["怀旧铁板", "豉油西餐"], focus: "考察铁板餐黑椒汁、洋葱汁调配，及浇汁视觉听觉呈现。餐后近西九龙站返程。", transit: "🚇 【土瓜湾站】落山道出口，步行3分钟。" }
            ]
        },
        {
            day: 6, label: "🌟 备选", title: "高预算与极致出品参考库 (视预算取舍)",
            locations: [
                { name: "锋膳 (Kin's Kitchen)", lat: 22.2774, lng: 114.1738, tags: ["高端粤菜", "神级烧腊"], focus: "极品蜜汁叉烧与高阶粤菜处理。考察高端食材如何在传统手法下提升溢价，作为门店VIP包间或高端单品的研发标杆。", transit: "🚇 【湾仔站】A3出口，步行约5分钟。" },
                { name: "卅二公馆 (Mott 32)", lat: 22.2806, lng: 114.1594, tags: ["黑毛猪叉烧", "极致装潢"], focus: "考察其闻名全球的“极品蜜汁黑毛猪叉烧”，体验其将传统烧味做成国际化奢侈品的切割摆盘与环境氛围。", transit: "🚇 【中环站】K出口，渣打银行大厦地库。" },
                { name: "大班楼 (The Chairman)", lat: 22.2845, lng: 114.1534, tags: ["亚洲第一", "顶级本味"], focus: "不加味精的极致本味提取。重点考察其独创酱汁（如鸡油花雕、蟹汁）的提鲜逻辑，极大拓宽厨师的调味视野。", transit: "🚇 【中环站】D2出口，威灵顿街。" }
            ]
        }
    ];

    // --- 地图初始化 ---
    const map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    let currentMarkers = [];
    let currentPolyline = null;
    let currentDayIndex = 0;

    // --- UI 渲染逻辑 ---
    function initTabs() {
        const tabsContainer = document.getElementById('day-tabs');
        itineraryData.forEach((data, index) => {
            const li = document.createElement('li');
            li.className = 'flex-none mr-1 last:mr-0';
            // 特殊样式给备选库
            const isPremium = index === 5;
            li.innerHTML = `
                <button onclick="selectDay(${index})" id="tab-btn-${index}"
                        class="inline-block px-4 py-3 border-b-2 rounded-t-lg transition-colors duration-200 font-bold
                               ${isPremium ? 'text-amber-600' : 'text-gray-500'} border-transparent">
                    ${data.label}
                </button>
            `;
            tabsContainer.appendChild(li);
        });
    }

    // 更新星星渲染
    window.setRating = function(locName, rating) {
        if(!userNotes[locName]) userNotes[locName] = {};
        userNotes[locName].rating = rating;
        saveLocalData();
        selectDay(currentDayIndex); // 重新渲染刷新星星
    }

    // 更新打卡状态
    window.toggleDone = function(locName) {
        if(!userNotes[locName]) userNotes[locName] = {};
        userNotes[locName].done = !userNotes[locName].done;
        saveLocalData();
        selectDay(currentDayIndex); 
    }

    // 更新笔记
    window.updateNote = function(locName, text) {
        if(!userNotes[locName]) userNotes[locName] = {};
        userNotes[locName].note = text;
        saveLocalData();
    }

    function selectDay(index) {
        currentDayIndex = index;
        
        // 更新 Tab 高亮
        itineraryData.forEach((_, i) => {
            const btn = document.getElementById(`tab-btn-${i}`);
            if (i === index) {
                btn.style.borderColor = i === 5 ? '#d97706' : '#2563eb'; // 备选用金色
                btn.style.color = i === 5 ? '#d97706' : '#2563eb';
            } else {
                btn.style.borderColor = 'transparent';
                btn.style.color = i === 5 ? '#92400e' : '#64748b'; // 未选中状态
            }
        });

        const dayData = itineraryData[index];
        document.getElementById('day-title').innerHTML = dayData.title;

        // 清理地图
        currentMarkers.forEach(m => map.removeLayer(m));
        if (currentPolyline) map.removeLayer(currentPolyline);
        currentMarkers = [];
        const locationsContainer = document.getElementById('locations-container');
        locationsContainer.innerHTML = '';
        const latLngs = [];

        // 渲染卡片
        dayData.locations.forEach(loc => {
            const state = userNotes[loc.name] || { done: false, rating: 0, note: '' };
            const isDone = state.done;
            const rating = state.rating;

            // 地图打点
            const markerColor = isDone ? 'gray' : (index === 5 ? 'orange' : 'blue');
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            marker.bindPopup(`<b>${loc.name}</b>`);
            currentMarkers.push(marker);
            latLngs.push([loc.lat, loc.lng]);

            // 卡片 HTML
            const tagsHtml = loc.tags.map(t => `<span class="bg-slate-100 text-slate-600 border border-slate-200 text-[10px] px-1.5 py-0.5 rounded">${t}</span>`).join('');
            const starsHtml = [1,2,3,4,5].map(star => 
                `<span onclick="setRating('${loc.name}', ${star})" class="cursor-pointer text-2xl ${rating >= star ? 'text-amber-400' : 'text-slate-200'}">★</span>`
            ).join('');

            const card = document.createElement('div');
            card.className = `bg-white p-4 rounded-xl shadow-sm border border-slate-200 card-transition border-l-4 border-l-blue-500 ${isDone ? 'done-card' : ''} ${index === 5 && !isDone ? '!border-l-amber-500' : ''}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h3 class="font-bold text-slate-800 text-lg leading-tight flex items-center gap-2">
                            ${loc.name}
                        </h3>
                        <div class="flex flex-wrap gap-1 mt-1">${tagsHtml}</div>
                    </div>
                    <button onclick="toggleDone('${loc.name}')" class="shrink-0 flex items-center gap-1 ${isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'} hover:bg-emerald-200 text-xs font-bold py-1.5 px-3 rounded-full transition-colors">
                        ${isDone ? '✅ 已打卡' : '⭕ 待打卡'}
                    </button>
                </div>

                <div class="bg-amber-50 rounded p-2.5 text-sm text-slate-700 border border-amber-100 my-3">
                    <span class="font-bold text-amber-800 block text-xs mb-1">👨‍🍳 研发对标要求：</span>
                    ${loc.focus}
                </div>

                <div class="border-t border-slate-100 pt-3 mt-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-slate-500">现场评分 (惊艳度/借鉴度)</span>
                        <div class="flex gap-1">${starsHtml}</div>
                    </div>
                    <textarea onblur="updateNote('${loc.name}', this.value)" placeholder="✍️ 记录后厨灵感或配方猜测 (自动保存)..." class="w-full bg-slate-50 border border-slate-200 rounded p-2 text-sm text-slate-700 focus:ring-1 focus:ring-blue-400 focus:outline-none resize-none" rows="2">${state.note}</textarea>
                </div>

                <div class="flex justify-between items-end gap-2 mt-3 pt-2">
                    <span class="text-[11px] text-slate-400 leading-tight flex-1">📍 ${loc.transit}</span>
<a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank" class="shrink-0 bg-blue-600 text-white text-xs font-bold py-1.5 px-3 rounded flex items-center shadow-sm">                        🗺️ 导航
                    </a>
                </div>
            `;
            locationsContainer.appendChild(card);
        });

        // 绘制连线 (备选库不需要连线)
        if (latLngs.length > 0) {
            if (index !== 5) {
                currentPolyline = L.polyline(latLngs, {color: '#3b82f6', weight: 3, opacity: 0.6, dashArray: '5, 5'}).addTo(map);
            }
            map.fitBounds(L.latLngBounds(latLngs), { padding: [30, 30] });
        }
        document.getElementById('info-panel').scrollTop = 0;
    }

    // 初始化并加载 Day 1
    initTabs();
    selectDay(0);
</script>
</body>
</html>
